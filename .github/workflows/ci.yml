name: Quality
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: eduos
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: eduos_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eduos -d eduos_test"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql://eduos:ci-only-password@localhost:5432/eduos_test
    steps:
      - uses: actions/checkout@v4
      - name: Require a reviewed dependency lockfile
        run: test -f pnpm-lock.yaml || { echo 'Generate and commit pnpm-lock.yaml with a successful pnpm install before enabling CI.'; exit 1; }
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:setup
      - run: pnpm agents:validate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:integration
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
